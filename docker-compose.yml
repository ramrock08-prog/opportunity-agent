services:
  opportunity-agent:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      APP_ENV: production
      SERVE_FRONTEND: "1"
      AUTH_REQUIRED: "1"
      AUTH_REQUIRE_VERIFIED: "1"
      AUTH_DEV_SHOW_TOKENS: "0"
      PUBLIC_APP_URL: http://localhost:8000
      CORS_ORIGINS: http://localhost:8000
      RATE_LIMIT_ENABLED: "1"
      TRUST_PROXY: "1"
      OPPORTUNITY_DB_PATH: /app/data/opportunity_agent.db
    volumes:
      - opportunity_data:/app/data

volumes:
  opportunity_data: