services:
  - type: web
    name: opportunity-agent
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: SERVE_FRONTEND
        value: "1"
      - key: AUTH_REQUIRED
        value: "1"
      # Flip to "1" after adding SENDER_EMAIL/SENDER_PASSWORD.
      - key: AUTH_REQUIRE_VERIFIED
        value: "0"
      - key: AUTH_DEV_SHOW_TOKENS
        value: "0"
      - key: AUTH_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: https://opportunity-agent-v39s.onrender.com
      - key: PUBLIC_APP_URL
        value: https://opportunity-agent-v39s.onrender.com
      - key: RATE_LIMIT_ENABLED
        value: "1"
      - key: TRUST_PROXY
        value: "1"
      # Free instances have ephemeral storage. Use DATABASE_URL with a
      # managed PostgreSQL database for durable data.
      - key: OPPORTUNITY_DB_PATH
        value: /app/data/opportunity_agent.db
      - key: GEMINI_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: SENDER_EMAIL
        sync: false
      - key: SENDER_PASSWORD
        sync: false
      - key: RECEIVER_EMAIL
        sync: false