services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: opportunity_agent
      POSTGRES_USER: opportunity
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-in-env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opportunity -d opportunity_agent"]
      interval: 5s
      timeout: 5s
      retries: 10

  opportunity-agent:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: production
      SERVE_FRONTEND: "1"
      AUTH_REQUIRED: "1"
      AUTH_REQUIRE_VERIFIED: "1"
      AUTH_DEV_SHOW_TOKENS: "0"
      CORS_ORIGINS: http://localhost:8000
      PUBLIC_APP_URL: http://localhost:8000
      RATE_LIMIT_ENABLED: "1"
      DATABASE_URL: postgresql://opportunity:${POSTGRES_PASSWORD:-change-me-in-env}@db:5432/opportunity_agent

volumes:
  postgres_data: