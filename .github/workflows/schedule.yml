name: Run Drone Scout

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */7 * * *'  # 👈 Runs every 7 hours

# 👈 THIS IS CRITICAL: Gives your bot permission to save the memory file
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests google-genai

      - name: Run AI Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
        run: python agent.py

      # 👈 NEW STEP: Saves the memory file back to GitHub so it's there next time
      - name: Save Memory Bank
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add hackathons.json
          git commit -m "🤖 Update hackathon memory bank" || echo "No new hackathons found, nothing to save."
          git push
