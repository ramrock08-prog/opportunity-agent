name: UAV Drone Scout

on:
  workflow_dispatch:       # Manual trigger button stays available
  schedule:
    - cron: '0 */7 * * *'  # Every 7 hours exactly

# Critical: allows bot to save hackathons.json back to repo
permissions:
  contents: write

jobs:
  scout:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests google-genai

      - name: Run Scout Agent
        env:
          GEMINI_API_KEY:   ${{ secrets.GEMINI_API_KEY }}
          TAVILY_API_KEY:   ${{ secrets.TAVILY_API_KEY }}
          SENDER_EMAIL:     ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD:  ${{ secrets.SENDER_PASSWORD }}
          RECEIVER_EMAIL:   ${{ secrets.RECEIVER_EMAIL }}
        run: python agent.py

      # Saves memory only if hackathons.json actually changed
      - name: Save Memory Bank
        run: |
          git config --global user.name  "drone-scout-bot"
          git config --global user.email "drone-scout-bot@users.noreply.github.com"
          git add hackathons.json
          git diff --staged --quiet || git commit -m "🤖 Update hackathon memory [skip ci]"
          git push || echo "Nothing new to push."
