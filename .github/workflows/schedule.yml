name: Opportunity Agent discovery

on:
  workflow_dispatch:
    inputs:
      category:
        description: Opportunity category to search
        required: true
        default: internship
        type: choice
        options:
          - hackathon
          - internship
          - job
          - scholarship
          - fellowship
          - competition
          - research
      limit:
        description: Maximum Gemini extractions (1-10)
        required: true
        default: "3"
        type: string
  schedule:
    # Daily at 06:00 UTC. Keep this small to control API costs.
    - cron: "0 6 * * *"

permissions:
  contents: write

concurrency:
  group: opportunity-discovery
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore opportunity memory into SQLite
        run: |
          python - <<'PY'
          from database import initialize_database

          print("SQLite schema ready:", initialize_database())
          PY

      - name: Run discovery
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        run: |
          python run_agent.py \
            --category "${{ inputs.category || 'internship' }}" \
            --limit "${{ inputs.limit || '3' }}"

      - name: Export a portable JSON snapshot
        run: |
          python - <<'PY'
          from storage import export_opportunities_json

          path = export_opportunities_json("opportunities.json")
          print("Snapshot written:", path)
          PY

      - name: Save opportunity memory
        run: |
          git config user.name "opportunity-agent-bot"
          git config user.email "opportunity-agent-bot@users.noreply.github.com"
          git add opportunities.json
          git diff --staged --quiet || \
            git commit -m "chore: update opportunity snapshot [skip ci]"
          git push || echo "Nothing to push."

      - name: Email digest (optional)
        continue-on-error: true
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
        run: python notify.py --send