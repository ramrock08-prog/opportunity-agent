name: Run Drone Scout

on:
  workflow_dispatch:   # 👈 Lets you run it manually
  schedule:
    - cron: '0 */7 * * *'  # 👈 ONLY runs exactly every 7 hours

# Gives your bot explicit permission to save the memory file
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests google-genai

      - name: Run AI Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
        run: python agent.py

      # Safe save block: Commits memory ONLY if there are new hackathons
      - name: Save Memory Bank
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add hackathons.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 Update hackathon memory bank" && git push)
